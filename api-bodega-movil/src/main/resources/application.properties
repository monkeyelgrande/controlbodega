# ==========================================================================
# API Bodega Movil - configuracion
# ==========================================================================
# Esta API corre en el MISMO PC servidor que tiene PostgreSQL, por eso
# apunta a localhost. La app Android NUNCA habla con Postgres directamente.
# ==========================================================================

# (El puerto se define mas abajo, junto al resto de la config por empresa.)

# --- Conexion a PostgreSQL (configurable POR EMPRESA, sin recompilar) ---
# Cada valor toma el de la variable de entorno indicada; si no existe, usa
# el valor por defecto (lo que va despues de los dos puntos).
#
# Para cada empresa solo cambias el NOMBRE de la base (BODEGA_DB_NAME).
# Host y puerto normalmente quedan en localhost:5432 porque la API corre
# en el mismo PC servidor que Postgres.
spring.datasource.url=jdbc:postgresql://${BODEGA_DB_HOST:localhost}:${BODEGA_DB_PORT:5432}/${BODEGA_DB_NAME:bodega_nuevo}?tcpKeepAlive=true
spring.datasource.username=${BODEGA_DB_USER:postgres}
spring.datasource.password=${BODEGA_DB_PASS:monkey}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de conexiones (HikariCP, incluido en spring-boot-starter-jdbc)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=10000

# --- Token de sesion (firma HMAC) ---
# IMPORTANTE: cambia este valor por una cadena larga y secreta antes de
# usarlo en produccion. Si se filtra, cualquiera podria falsificar sesiones.
app.token.secret=${BODEGA_TOKEN_SECRET:CAMBIA-ESTA-CLAVE-LARGA-Y-SECRETA-bodega-2026-xxxxxxxxxxxx}
# Duracion del token en minutos. 43200 = 30 dias: la sesion se mantiene
# aunque cierren y abran la app; solo expira a los 30 dias o al cerrar
# sesion manualmente.
app.token.ttl-minutes=${BODEGA_TOKEN_TTL:43200}
# Puerto (por si una empresa necesita otro)
server.port=${BODEGA_API_PORT:8080}

# Log mas claro en consola
logging.level.org.springframework=WARN
logging.level.com.bodega=INFO
